name: Publish

# Uploads coding-client to PyPI with Trusted Publishing (OIDC — no token, no repository secret).
#
# ⛔ Why this job is NOT inside ci-workflows' python-library.yml: PyPI does not accept a REUSABLE
#    workflow as a Trusted Publisher — "Reusable workflows cannot currently be used as the
#    workflow in a Trusted Publisher" (pypi/warehouse#11096). The upload must run from a workflow
#    file in THIS repository. Gates stay where they are (ci.yml); this file only builds and
#    uploads on an explicit release, so a tag is the release act and never a side effect of a
#    merge.
#
# Prerequisite on pypi.org — a pending publisher (first upload) or trusted publisher (later):
#   project: coding-client | owner: nonagenticai | repo: coding-client
#   workflow: publish.yml | environment: pypi
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write      # the OIDC token PyPI exchanges for a short-lived upload credential
    steps:
      # Pins are commit SHAs with the version in a trailing comment: a moving tag (or, worse,
      # a moving BRANCH) is code from outside this repository that runs with `id-token: write`,
      # and this job's OIDC token is what authorises a PyPI upload. Dependabot's
      # github-actions ecosystem updates the SHA and the comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # enable-cache:false — a publish job must not consume a cache that a PR run can write:
      # a poisoned uv cache would end up inside the wheel uploaded to PyPI (zizmor
      # cache-poisoning). Nothing here needs the cache.
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false

      # The project requires >=3.14; install one explicitly so the build never depends on what
      # the runner image happens to ship.
      - run: uv python install 3.14

      # A tag may never publish a version other than the one it names.
      - name: assert the tag matches pyproject
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          [ "$version" = "$tag" ] || {
            echo "pyproject version '$version' != tag 'v$tag'" >&2; exit 1; }
          echo "version $version matches the tag"

      # PyPI is immutable: probe the exact version first and fail CLOSED. Only a definitive 404
      # uploads; any other non-200 refuses rather than guessing. `skip-existing` below is the
      # second, server-side guard for a race between this probe and the upload.
      - name: probe PyPI for this version
        id: probe
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "publishing coding-client $version"
          code=$(curl -sS --retry 3 --max-time 15 -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/coding-client/$version/json") || true
          case "$code" in
            200) echo "already on PyPI — skipping"; echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *)   echo "PyPI probe returned $code — refusing to publish blind" >&2; exit 1 ;;
          esac

      - name: build
        if: steps.probe.outputs.exists == 'false'
        run: uv build

      - name: upload
        if: steps.probe.outputs.exists == 'false'
        # Was @release/v1 — a BRANCH. Pinned to the v1.14.3 release commit instead, so what we
        # audit is what runs; Dependabot keeps the pin current.
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true
